[project]
name = "provenance-tiered-rag"
version = "0.2.0"
description = "Retrieval over NZ GST law that knows each source's tier and date, with every cited number checked in code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Necmi Kural" }]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.34.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.11",
]

[project.scripts]
provrag = "provrag.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "provrag"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]  # a word list written as one string reads better

[tool.pytest.ini_options]
testpaths = ["tests"]
