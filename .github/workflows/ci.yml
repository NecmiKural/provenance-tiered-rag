name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: provrag
          POSTGRES_PASSWORD: provrag
          POSTGRES_DB: provrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provrag -d provrag"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PROVRAG_DATABASE_URL: postgresql://provrag:provrag@localhost:5432/provrag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate

  space:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: hugging-face
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "HF_TOKEN is not set: skipping the Space upload"; exit 0; fi
          # an unknown base (a new branch or a force push) counts as a change
          if git diff --quiet "$BEFORE" HEAD -- docs/evidence 2>/dev/null; then
            echo "docs/evidence did not change"; exit 0
          fi
          echo "upload=true" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.upload == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - if: steps.check.outputs.upload == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          printf '{"commit": "%s"}\n' "${GITHUB_SHA::7}" > docs/evidence/build.json
          uvx --from huggingface_hub==2.3.0 hf upload necmikural/provenance-rag-evidence docs/evidence . \
            --repo-type space --commit-message "deploy ${GITHUB_SHA::7}"

  dataset:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: hugging-face
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        env:
          HF_TOKEN: ${{ secrets.HF_DATASET_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "HF_DATASET_TOKEN is not set: skipping the dataset upload"; exit 0; fi
          # an unknown base (a new branch or a force push) counts as a change
          if git diff --quiet "$BEFORE" HEAD -- evals docs/dataset src/provrag/dataset.py 2>/dev/null; then
            echo "the eval set and its card did not change"; exit 0
          fi
          echo "upload=true" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.upload == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - if: steps.check.outputs.upload == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_DATASET_TOKEN }}
        run: |
          PYTHONPATH=src python3 -m provrag.dataset staged
          uvx --from huggingface_hub==2.3.0 hf upload necmikural/provenance-rag-evals staged . \
            --repo-type dataset --commit-message "deploy ${GITHUB_SHA::7}"
