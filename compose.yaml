# Local Postgres with pgvector. Bound to localhost only; the password is for local development
# and the CI service, never for anything reachable from a network. Port 5434 leaves 5433 to
# bank-reconciliation-agent.
services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: provrag
      POSTGRES_PASSWORD: provrag
      POSTGRES_DB: provrag
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provrag -d provrag"]
      interval: 2s
      timeout: 3s
      retries: 30
